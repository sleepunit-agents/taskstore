name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, wunder]
    container: node:22-bookworm

    steps:
      - name: Checkout taskstore
        uses: actions/checkout@v4
        with:
          path: taskstore

      - name: Checkout felag (file: sibling dep)
        uses: actions/checkout@v4
        with:
          repository: sleepunit-agents/felag
          path: felag

      - name: Install dependencies
        working-directory: taskstore
        run: npm ci

      - name: Type check
        working-directory: taskstore
        run: npx tsc --noEmit

      - name: Test
        working-directory: taskstore
        run: npx vitest run

      - name: Notify Discord
        if: always()
        continue-on-error: true
        shell: bash
        env:
          WEBHOOK_ID: ${{ secrets.DISCORD_CI_WEBHOOK_ID }}
          WEBHOOK_TOKEN: ${{ secrets.DISCORD_CI_WEBHOOK_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"; WORD="succeeded"
          else
            ICON="❌"; WORD="failed"
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          curl -s -X POST \
            "https://discord.com/api/webhooks/${WEBHOOK_ID}/${WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "{\"content\":\"**${ICON} Build ${WORD}** — ${{ github.repository }} #${{ github.run_number }}\nBranch: \`${{ github.ref_name }}\` | Commit: \`${SHORT_SHA}\`\n${RUN_URL}\"}"
